name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --timeout 30 --max-retries 2 "./dist/**/*.html"
          fail: true
