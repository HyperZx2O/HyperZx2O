<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Deep blue gradient with subtle depth -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0000F2"/>
      <stop offset="50%" stop-color="#0000D4"/>
      <stop offset="100%" stop-color="#0000AA"/>
    </linearGradient>
    
    <!-- Radial glow for depth -->
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="rgba(237,255,69,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,242,0)"/>
    </radialGradient>
    
    <!-- Sunburst pattern -->
    <pattern id="sunburst" x="0" y="0" width="1200" height="630" patternUnits="userSpaceOnUse">
      <g transform="translate(600,315)">
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(0)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(15)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(30)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(45)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(60)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(75)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(90)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(105)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(120)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(135)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(150)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(165)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(180)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(195)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(210)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(225)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(240)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(255)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(270)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(285)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(300)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(315)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(330)"/>
        <line x1="0" y1="0" x2="0" y2="-600" stroke="rgba(255,255,255,0.015)" stroke-width="2" transform="rotate(345)"/>
      </g>
    </pattern>
    
    <!-- Subtle noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="monoNoise"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Sunburst rays from center -->
  <rect width="1200" height="630" fill="url(#sunburst)"/>
  
  <!-- Radial glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Geometric accent: top-left corner frame -->
  <path d="M 60 60 L 60 120 M 60 60 L 120 60" stroke="#EDFF45" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Geometric accent: bottom-right corner frame -->
  <path d="M 1140 570 L 1140 510 M 1140 570 L 1080 570" stroke="#EDFF45" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Small decorative dots -->
  <circle cx="180" cy="180" r="2" fill="#EDFF45" opacity="0.3"/>
  <circle cx="1020" cy="450" r="2" fill="#EDFF45" opacity="0.3"/>
  
  <!-- Main name: large, bold, commanding -->
  <text x="600" y="260" text-anchor="middle" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif" font-size="108" font-weight="700" fill="#FFFFFF" letter-spacing="6">HYPERZX2O</text>
  
  <!-- Accent line under name -->
  <rect x="420" y="285" width="360" height="3" fill="#EDFF45" opacity="0.8"/>
  
  <!-- Subtitle: PORTFOLIO in accent color -->
  <text x="600" y="340" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#EDFF45" letter-spacing="16" font-weight="400">PORTFOLIO</text>
  
  <!-- Tagline: three identities -->
  <text x="600" y="400" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)" letter-spacing="3" font-weight="300">CSE @ IUT · WEB DEV · COMPETITIVE PROGRAMMING</text>
  
  <!-- Divider line -->
  <line x1="500" y1="440" x2="700" y2="440" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  
  <!-- GitHub handle -->
  <text x="600" y="480" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="rgba(255,255,255,0.35)" letter-spacing="1.5">github.com/HyperZx2O</text>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="#EDFF45" opacity="0.6"/>
</svg>